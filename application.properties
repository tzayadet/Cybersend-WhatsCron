spring.application.name=CyberSend - WhatsApp Scheduler

# Local-only development database. H2 console is disabled by default.
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./cybersend-db;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

server.port=${PORT:8080}
server.address=${SERVER_ADDRESS:127.0.0.1}
server.servlet.context-path=/

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

logging.level.com.whatsapp=INFO
logging.level.org.springframework.web=INFO

# Set an explicit comma-separated origin list when hosting a separate frontend.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}
